        question: "101. What is the value of next CPU burst if a = 0.8 (และให้ตัวอื่น ๆ มา ให้เราลองแทนในสูตรได้เลย)\nτ_(n+1) = α * t_n + (1 - α) * τ_n",
        options: [
          { key: "a", text: "τ_(n+1) = α * t_n + (1 - α) * τ_n" },
          { key: "b", text: "τ_(n+1) = (1 - α) * t_n + α * τ_n" },
          { key: "c", text: "τ_(n+1) = α * (t_n + τ_n)" },
          { key: "d", text: "τ_(n+1) = (t_n + τ_n) / 2" }
        ],
        answer: "a",
        note: "สูตร Exponential Smoothing สำหรับทำนาย CPU burst รอบถัดไป: τ_(n+1) = α * t_n + (1 - α) * τ_n"
      },
      {
        id: 102,
        chapter: 6,
        chapterTitle: "Chapter 6 CPU Scheduling",
        question: "102. What is the solution of starvation in priority scheduling?",
        options: [
          { key: "a", text: "aging" },
          { key: "b", text: "round robin slicing" },
          { key: "c", text: "preemption" },
          { key: "d", text: "quantum boosting" }
        ],
        answer: "a",
        note: "Aging คือเทคนิคค่อยๆ ทยอยเพิ่มระดับ Priority ให้กับงานที่รออยู่ในคิวนาน เพื่อแก้ปัญหา Starvation"
      },
      {
        id: 103,
        chapter: 6,
        chapterTitle: "Chapter 6 CPU Scheduling",
        question: "103. What is approximately scheduling algorithm?",
        options: [
          { key: "a", text: "Round-Robin (RR)" },
          { key: "b", text: "First-Come First-Served" },
          { key: "c", text: "Shortest-Remaining-Time-First" },
          { key: "d", text: "Multilevel Feedback Queue" }
        ],
        answer: "a",
        note: "ตามที่ระบุในสรุปข้อสอบ: Round-Robin (RR)"
      },
      {
        id: 104,
        chapter: 6,
        chapterTitle: "Chapter 6 CPU Scheduling",
        question: "104. What scheduling algorithm is divided by time slice?",
        options: [
          { key: "a", text: "Multilevel queue" },
          { key: "b", text: "Multilevel feedback queue" },
          { key: "c", text: "FCFS" },
          { key: "d", text: "ทั้ง Multilevel queue และ Multilevel feedback queue" }
        ],
        answer: "d",
        note: "ทั้ง Multilevel Queue และ Multilevel Feedback Queue สามารถประยุกต์ใช้การแบ่งตาม Time Slice"
      },
      {
        id: 105,
        chapter: 6,
        chapterTitle: "Chapter 6 CPU Scheduling",
        question: "105. Why windows need to use high amount of ram?",
        options: [
          { key: "a", text: "no long-term scheduling" },
          { key: "b", text: "microkernel design" },
          { key: "c", text: "no virtual memory pagination" },
          { key: "d", text: "cooperative context switching" }
        ],
        answer: "a",
        note: "Windows ไม่มี Long-term scheduler สำหรับคัดกรองงาน ทำให้โปรเซสที่ถูกสร้างขึ้นทั้งหมดจะถูกโหลดเข้าสู่ RAM โดยตรงทันที"
      },

      // Chapter 7: Deadlock
      {
        id: 106,
        chapter: 7,
        chapterTitle: "Chapter 7 Deadlock",
        question: "106. What is the limitation of Resource-allocation graph? - ไม่แน่ใจระหว่าง cyclic graph กับ several instances",
        options: [
          { key: "a", text: "several instances (หากมีหลาย instance วงจร cycle อาจไม่ใช่ deadlock เสมอไป)" },
          { key: "b", text: "cyclic graph" },
          { key: "c", text: "cannot represent processes" },
          { key: "d", text: "applicable to single-core only" }
        ],
        answer: "a",
        note: "Resource-allocation graph หากทรัพยากรแต่ละชนิดมีหลาย instance (several instances) การเกิด Cycle ไม่ได้ยืนยันเสมอว่าจะเกิด Deadlock"
      },
      {
        id: 107,
        chapter: 7,
        chapterTitle: "Chapter 7 Deadlock",
        question: "107. How to prevent circular wait?",
        options: [
          { key: "a", text: "Each process can request only a single instance per request." },
          { key: "b", text: "Each process can request resources only in an increasing order." },
          { key: "c", text: "Each process must follow the steps: request, use, and release." },
          { key: "d", text: "Each process must has a semaphore to protect the critical section." }
        ],
        answer: "b",
        note: "การป้องกัน Circular Wait ทำได้โดยการกำหนดลำดับทรัพยากรเชิงเส้น (Total Ordering) และบังคับให้ขอทรัพยากรเรียงตามลำดับเพิ่มขึ้นเท่านั้น"
      },
      {
        id: 108,
        chapter: 7,
        chapterTitle: "Chapter 7 Deadlock",
        question: "108. Which is not a safe sequence? - B P4, P3, P1, P2, P0\n\n| Process | Allocation (A B C) | Max (A B C) | Available (A B C) | Need (A B C) |\n| P0 | 0 1 0 | 7 5 3 | 3 3 2 | 7 4 3 |\n| P1 | 2 0 0 | 3 2 2 | | 1 2 2 |\n| P2 | 3 0 2 | 9 0 2 | | 6 0 0 |\n| P3 | 2 1 1 | 2 2 2 | | 0 1 1 |\n| P4 | 0 0 2 | 4 3 3 | | 4 3 1 |",
        options: [
          { key: "a", text: "P1, P4, P3, P2, P0" },
          { key: "b", text: "P4, P3, P1, P2, P0" },
          { key: "c", text: "P1, P3, P4, P2, P0" },
          { key: "d", text: "P3, P1, P4, P2, P0" }
        ],
        answer: "b",
        note: "ณ ตอนเริ่มต้น Available คือ [3, 3, 2] แต่ Need ของ P4 คือ [4, 3, 1] ซึ่งมากกว่าทรัพยากรที่มีอยู่ จึงไม่สามารถเริ่มทำงานที่ P4 ก่อนได้ ลำดับ B จึงไม่ใช่ Safe Sequence"
      },
      {
        id: 109,
        chapter: 7,
        chapterTitle: "Chapter 7 Deadlock",
        question: "109. What will database do with deadlock?",
        options: [
          { key: "a", text: "deadlock detection and recovery" },
          { key: "b", text: "deadlock prevention strictly" },
          { key: "c", text: "deadlock avoidance by Banker's algorithm" },
          { key: "d", text: "system restart immediately" }
        ],
        answer: "a",
        note: "ระบบฐานข้อมูล (Database) นิยมใช้วิธีตรวจจับ Deadlock แล้วทำ Recovery โดยการ Rollback ธุรกรรมย้อนกลับ"
      }
    ];

    // State tracking
    const userAnswers = {};
    let activeChapter = "all";

    // DOM Elements
    const container = document.getElementById("questions-container");
    const answeredCountEl = document.getElementById("answered-count");
    const correctCountEl = document.getElementById("correct-count");
    const wrongCountEl = document.getElementById("wrong-count");
    const chapterSelect = document.getElementById("chapter-select");
    const btnReset = document.getElementById("btn-reset");
    const btnShowAll = document.getElementById("btn-show-all-answers");
    const btnShuffleOptions = document.getElementById("btn-shuffle-options");

    function renderQuestions() {
      container.innerHTML = "";

      const filtered = activeChapter === "all"
        ? questionsData
        : questionsData.filter(q => q.chapter === parseInt(activeChapter));

      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-500 bg-white rounded-xl shadow-sm">ไม่พบข้อสอบในหมวดนี้</div>`;
        return;
      }

      filtered.forEach((item) => {
        const card = document.createElement("div");
        card.id = `q-card-${item.id}`;
        card.className = "bg-white rounded-xl border border-slate-200 shadow-sm p-5 md:p-6 transition hover:shadow-md";

        // Category Tag & ID
        const topMeta = `
          <div class="flex items-center justify-between gap-2 mb-2">
            <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-100">
              ${item.chapterTitle}
            </span>
            <span class="text-xs text-slate-400 font-mono">ข้อที่ ${item.id}</span>
          </div>
        `;

        // Question text (handles code formatted with newlines)
        const formattedQuestion = item.question
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/\n/g, "<br>");

        const questionContent = `
          <div class="text-slate-900 font-semibold text-base mb-4 leading-relaxed">
            ${formattedQuestion}
          </div>
        `;

        // Options list
        let optionsHtml = `<div class="space-y-2.5" id="opt-group-${item.id}">`;
        item.options.forEach(opt => {
          const selected = userAnswers[item.id] === opt.key;
          optionsHtml += `
            <button 
              onclick="selectOption(${item.id}, '${opt.key}')" 
              id="opt-${item.id}-${opt.key}"
              class="w-full text-left px-4 py-3 rounded-lg border text-sm font-medium transition flex items-start space-x-3
              ${selected ? 'border-indigo-600 bg-indigo-50/50 ring-1 ring-indigo-500' : 'border-slate-200 bg-white hover:bg-slate-50 text-slate-700'}">
              <span class="inline-flex items-center justify-center w-5 h-5 rounded-full text-xs font-bold uppercase shrink-0 mt-0.5
              ${selected ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}">
                ${opt.key}
              </span>
              <span class="flex-1">${opt.text}</span>
            </button>
          `;
        });
        optionsHtml += `</div>`;

        // Feedback / Answer explanation box
        const feedbackHtml = `
          <div id="feedback-${item.id}" class="mt-4 pt-3 border-t border-slate-100 text-xs hidden">
            <div class="p-3 rounded-lg flex items-start gap-2 bg-slate-50 text-slate-700" id="feedback-box-${item.id}">
              <i class="fa-solid fa-circle-info text-base mt-0.5 shrink-0" id="feedback-icon-${item.id}"></i>
              <div>
                <p class="font-bold mb-1" id="feedback-text-${item.id}"></p>
                <p class="text-slate-600 leading-relaxed">${item.note || ''}</p>
              </div>
            </div>
          </div>
        `;

        card.innerHTML = topMeta + questionContent + optionsHtml + feedbackHtml;
        container.appendChild(card);

        // Update visuals if already answered
        if (userAnswers[item.id]) {
          updateQuestionUI(item.id, userAnswers[item.id]);
        }
      });

      updateStats();
    }

    function selectOption(questionId, selectedKey) {
      userAnswers[questionId] = selectedKey;
      updateQuestionUI(questionId, selectedKey);
      updateStats();
    }

    function updateQuestionUI(questionId, selectedKey) {
      const item = questionsData.find(q => q.id === questionId);
      if (!item) return;

      const isCorrect = selectedKey === item.answer;

      // Update Option buttons
      item.options.forEach(opt => {
        const btn = document.getElementById(`opt-${questionId}-${opt.key}`);
        if (!btn) return;

        btn.className = "w-full text-left px-4 py-3 rounded-lg border text-sm font-medium transition flex items-start space-x-3";
        const badge = btn.querySelector("span:first-child");

        if (opt.key === item.answer) {
          // Highlight correct answer
          btn.classList.add("border-emerald-500", "bg-emerald-50", "text-emerald-900");
          badge.className = "inline-flex items-center justify-center w-5 h-5 rounded-full text-xs font-bold uppercase shrink-0 mt-0.5 bg-emerald-600 text-white";
        } else if (opt.key === selectedKey && !isCorrect) {
          // Highlight chosen wrong answer
          btn.classList.add("border-rose-400", "bg-rose-50", "text-rose-900");
          badge.className = "inline-flex items-center justify-center w-5 h-5 rounded-full text-xs font-bold uppercase shrink-0 mt-0.5 bg-rose-600 text-white";
        } else {
          // Non-selected options
          btn.classList.add("border-slate-200", "bg-white", "opacity-60", "text-slate-600");
          badge.className = "inline-flex items-center justify-center w-5 h-5 rounded-full text-xs font-bold uppercase shrink-0 mt-0.5 bg-slate-100 text-slate-500";
        }
      });

      // Update Feedback Box
      const feedbackDiv = document.getElementById(`feedback-${questionId}`);
      const feedbackBox = document.getElementById(`feedback-box-${questionId}`);
      const feedbackIcon = document.getElementById(`feedback-icon-${questionId}`);
      const feedbackText = document.getElementById(`feedback-text-${questionId}`);

      if (feedbackDiv) {
        feedbackDiv.classList.remove("hidden");
        if (isCorrect) {
          feedbackBox.className = "p-3 rounded-lg flex items-start gap-2.5 bg-emerald-50/80 border border-emerald-200 text-emerald-900";
          feedbackIcon.className = "fa-solid fa-circle-check text-emerald-600 text-base mt-0.5 shrink-0";
          feedbackText.textContent = "ถูกต้อง! คำตอบคือข้อ " + item.answer.toUpperCase();
        } else {
          feedbackBox.className = "p-3 rounded-lg flex items-start gap-2.5 bg-rose-50/80 border border-rose-200 text-rose-900";
          feedbackIcon.className = "fa-solid fa-circle-xmark text-rose-600 text-base mt-0.5 shrink-0";
          feedbackText.textContent = `ยังไม่ถูกต้อง! เฉลยคือข้อ ${item.answer.toUpperCase()}`;
        }
      }
    }

    function updateStats() {
      const answeredKeys = Object.keys(userAnswers);
      const totalAnswered = answeredKeys.length;

      let correctCount = 0;
      answeredKeys.forEach(id => {
        const item = questionsData.find(q => q.id === parseInt(id));
        if (item && userAnswers[id] === item.answer) {
          correctCount++;
        }
      });

      const wrongCount = totalAnswered - correctCount;

      answeredCountEl.textContent = totalAnswered;
      correctCountEl.textContent = correctCount;
      wrongCountEl.textContent = wrongCount;
    }

    // Event Listeners
    chapterSelect.addEventListener("change", (e) => {
      activeChapter = e.target.value;
      renderQuestions();
    });

    btnReset.addEventListener("click", () => {
      if (confirm("ต้องการรีเซ็ตคำตอบและสถิติทั้งหมดใช่หรือไม่?")) {
        for (const k in userAnswers) delete userAnswers[k];
        renderQuestions();
      }
    });

    btnShowAll.addEventListener("click", () => {
      questionsData.forEach(q => {
        userAnswers[q.id] = q.answer;
      });
      renderQuestions();
    });

    // Shuffle options logic
    function shuffleOptions() {
      const keys = ['a', 'b', 'c', 'd', 'e', 'f'];
      questionsData.forEach(q => {
        const currentAnswerOpt = q.options.find(opt => opt.key === q.answer);

        // Fisher-Yates shuffle algorithm
        for (let i = q.options.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
        }

        // Reassign keys and update q.answer to the new position
        q.options.forEach((opt, idx) => {
          opt.key = keys[idx] || String.fromCharCode(97 + idx);
          if (opt === currentAnswerOpt) {
            q.answer = opt.key;
          }
        });
      });
    }

    btnShuffleOptions.addEventListener("click", () => {
      const hasAnswered = Object.keys(userAnswers).length > 0;
      if (!hasAnswered || confirm("ต้องการสลับลำดับตัวเลือกใหม่ทั้งหมดใช่หรือไม่? (คำตอบที่ทำไว้จะถูกรีเซ็ต)")) {
        shuffleOptions();
        for (const k in userAnswers) delete userAnswers[k];
        renderQuestions();
      }
    });

    // Initialize - สลับตัวเลือกเริ่มต้นทันทีเพื่อให้ตัวเลือกกระจาย ไม่กองอยู่ที่ข้อ A
    shuffleOptions();
    renderQuestions();
  </script>
</body>

</html>
